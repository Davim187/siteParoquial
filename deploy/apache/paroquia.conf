# Site paroquial — Apache (frontend estático + proxy para API no PM2)
# DocumentRoot aponta para o build do Vite em apps/web/dist

<VirtualHost *:80>
    ServerName paroquiansdasgracas.com.br
    ServerAlias www.paroquiansdasgracas.com.br

    DocumentRoot __APP_DIR__/apps/web/dist

    LimitRequestBody 12582912

    <Directory __APP_DIR__/apps/web/dist>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteBase /
        RewriteRule ^index\.html$ - [L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule . /index.html [L]
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api http://127.0.0.1:3333/api
    ProxyPassReverse /api http://127.0.0.1:3333/api
    ProxyPass /uploads http://127.0.0.1:3333/uploads
    ProxyPassReverse /uploads http://127.0.0.1:3333/uploads

    ErrorLog ${APACHE_LOG_DIR}/paroquia-error.log
    CustomLog ${APACHE_LOG_DIR}/paroquia-access.log combined
</VirtualHost>
