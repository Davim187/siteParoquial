name: Deploy produção

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validar secrets de deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          missing=()
          [ -z "$DEPLOY_HOST" ] && missing+=("DEPLOY_HOST")
          [ -z "$DEPLOY_USER" ] && missing+=("DEPLOY_USER")
          if [ -z "$DEPLOY_SSH_KEY" ] && [ -z "$DEPLOY_PASSWORD" ]; then
            missing+=("DEPLOY_SSH_KEY ou DEPLOY_PASSWORD")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Secrets ausentes no GitHub: ${missing[*]}"
            echo ""
            echo "Configure em: Settings → Secrets and variables → Actions → New repository secret"
            echo ""
            echo "  DEPLOY_HOST     = IP do VPS (ex.: 84.46.251.102)"
            echo "  DEPLOY_USER     = root"
            echo "  DEPLOY_SSH_KEY  = chave privada SSH (recomendado)"
            echo "  DEPLOY_PASSWORD = senha SSH (alternativa, menos segura)"
            exit 1
          fi

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -e
            if [ -d /var/www/.git ]; then
              APP_DIR=/var/www
            elif [ -d /www/.git ]; then
              APP_DIR=/www
            else
              echo "Repositório não encontrado em /var/www nem /www"
              echo "Rode no VPS: git clone https://github.com/Davim187/siteParoquial.git /var/www"
              exit 1
            fi
            cd "$APP_DIR"
            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            if [ ! -f .env.production ]; then
              echo "Arquivo .env.production não encontrado. Copie .env.production.example e configure."
              exit 1
            fi
            if ! grep -Eq '^POSTGRES_PASSWORD=.+' .env.production; then
              echo "POSTGRES_PASSWORD não definido em $APP_DIR/.env.production"
              exit 1
            fi
            bash deploy/remove-apache.sh
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T postgres \
              sh -c 'until pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" >/dev/null 2>&1; do sleep 1; done'
            for attempt in $(seq 1 20); do
              if docker compose -f docker-compose.prod.yml --env-file .env.production exec -T api npx prisma migrate deploy; then
                break
              fi
              [ "$attempt" -eq 20 ] && exit 1
              sleep 3
            done
            docker compose -f docker-compose.prod.yml --env-file .env.production exec -T api npx tsx prisma/seed.ts
