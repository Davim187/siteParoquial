# Produção: apenas Postgres. Web (Apache) e API (PM2) rodam no host.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paroquia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-619Fdmb.}
      POSTGRES_DB: ${POSTGRES_DB:-paroquia}
    volumes:
      - paroquia_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-paroquia} -d ${POSTGRES_DB:-paroquia}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  paroquia_pg:
