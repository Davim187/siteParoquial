services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paroquia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-619Fdmb.}
      POSTGRES_DB: ${POSTGRES_DB:-paroquia}
    volumes:
      - paroquia_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-paroquia} -d ${POSTGRES_DB:-paroquia}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      # DATABASE_URL vem do .env.production (não interpolar POSTGRES_PASSWORD aqui:
      # sem --env-file na CLI a senha fica vazia e a API entra em loop de restart)
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
    volumes:
      - uploads:/app/apps/api/uploads
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    depends_on:
      - api

volumes:
  paroquia_pg:
  uploads:
